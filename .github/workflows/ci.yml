# FloraScan CI - every part of the project, on every push and pull request.
#
#   static     syntax of every server/test file, translations, security headers
#              and rate limits, production build, dependency audit
#   web        MariaDB 10.4 with XAMPP's 1 MB packet limit + an MQTT broker +
#              the server, then the API, browser UI (every role), passkey and
#              MQTT end-to-end suites - the same ones as "npm test" and
#              "npm run test:iot"
#   ai-vision  the camera pipeline rules and the alert sender (CPU, OpenVINO)
#   firmware   the ESP32 sketch compiles for the DOIT DevKit V1
#   all-checks one required status for branch protection on main and demo
#
# Nothing here needs a secret: the database, broker and server are throwaway
# containers on the runner, and the tests refuse any database that is not local.

name: CI

on:
  push:
    branches: [main, demo, 'fix/**', 'feature/**']
  pull_request:
    branches: [main, demo]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  static:
    name: Static checks, translations, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Every server, script and test file parses
        run: |
          set -e
          for f in Server/*.js scripts/*.mjs tests/*.mjs tests/helpers/*.mjs; do
            node --check "$f"
          done

      - name: Translations (EN, BM, 中文)
        run: npm run test:i18n

      - name: Security headers and rate limits (real limits)
        run: npm run test:security

      - name: Production build
        run: npm run build

      - name: Dependency audit (fails on critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Dependency audit (high, report only)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reports high-severity advisories - run npm audit fix"

  web:
    name: Web app end to end (API, UI, passkeys, MQTT)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 127.0.0.1, not a service hostname: the test scripts refuse any database
      # that is not on this machine.
      DATABASE_URL: mysql://root:ci-root@127.0.0.1:3306/plant_registry
      MQTT_URL: mqtt://127.0.0.1:1883
      MQTT_TOPIC_PREFIX: florascan-ci
      PORT: '43210'
      CHROME_PATH: /usr/bin/google-chrome
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      IOT_SCREENSHOT: ''
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The same MariaDB as XAMPP (10.4) with its 1 MB max_allowed_packet, so a
      # photograph that would break registration on a team laptop breaks here.
      - name: Start MariaDB 10.4 (XAMPP settings) and an MQTT broker
        run: |
          docker run -d --name db -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=ci-root -e MARIADB_DATABASE=plant_registry \
            mariadb:10.4 --max-allowed-packet=1048576 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
          docker run -d --name broker -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          # Wait for a real query over TCP. "mysqladmin ping" also answers while
          # the image's first-boot server runs (no root password yet, no TCP),
          # and the next query then fails with "Access denied".
          for i in $(seq 1 90); do
            docker exec db mysql -h127.0.0.1 -uroot -pci-root -e 'SELECT 1' >/dev/null 2>&1 && break
            [ "$i" = 90 ] && { docker logs db | tail -40; exit 1; }
            sleep 2
          done
          docker exec db mysql -h127.0.0.1 -uroot -pci-root -e "SHOW VARIABLES LIKE 'max_allowed_packet'"

      - name: Create the schema and seed the demo data
        run: |
          # Server/data/photos is filled by "npm run import:species" and not in
          # git; the upload test needs one real JPEG from it (280 KB, under
          # XAMPP's 1 MB packet limit).
          mkdir -p Server/data/photos
          cp test-report/ai/det/det_best.jpg Server/data/photos/ci-upload-fixture.jpg
          # The seeded plants show the cached species photographs; stand the
          # same JPEG in for each one, rather than downloading from iNaturalist.
          node -e "
            const fs = require('fs');
            const files = new Set();
            JSON.stringify(JSON.parse(fs.readFileSync('Server/data/species.json', 'utf8')),
              (k, v) => { if (k === 'file' && typeof v === 'string' && /^[\w.-]+\.jpg$/.test(v)) files.add(v); return v; });
            for (const f of files) fs.copyFileSync('test-report/ai/det/det_best.jpg', 'Server/data/photos/' + f);
            console.log('species photo stand-ins:', files.size);
          "
          npm run db:setup
          node scripts/test-db.mjs

      - name: Start the server (test-only rate limits)
        run: |
          node Server/index.js --test-limits > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sk -o /dev/null -w '%{http_code}' "https://localhost:$PORT/api/public/stats" | grep -q 200 && exit 0
            sleep 1
          done
          echo "Server did not start"; cat server.log; exit 1

      - name: API (permissions, workflow, validation, AI camera alerts)
        run: npm run test:api

      - name: Browser UI, every role
        run: npm run test:ui

      - name: Passkeys (virtual authenticator)
        run: npm run test:passkey

      - name: IoT over MQTT, end to end
        run: npm run test:iot

      - name: Server log
        if: always()
        run: tail -n 300 server.log || true

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-logs
          path: |
            server.log
            test-report/iot/*.json
          retention-days: 7

  ai-vision:
    name: AI vision node (pipeline rules, alert sender)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-vision-node
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Only the three exported networks (~100 MB) from Git LFS, cached by their
      # hashes so the repository's LFS bandwidth is spent once, not every run.
      - name: LFS object list for the exported models
        run: git lfs ls-files -l -I "ai-vision-node/models/export/*" | cut -d' ' -f1 | sort > ../.lfs-models-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-models-${{ hashFiles('.lfs-models-id') }}
      - name: Fetch the exported models
        run: git lfs pull --include="ai-vision-node/models/export/*"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-vision-node/requirements.txt
      - name: Install the CPU runtime (no GUI)
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^(gradio|opencv-python)==' requirements.txt > ../requirements-ci.txt
          OPENCV=$(grep '^opencv-python==' requirements.txt | cut -d= -f3)
          pip install -r ../requirements-ci.txt "opencv-python-headless==$OPENCV"

      - name: Every Python file compiles
        run: python -m compileall -q app scripts

      - name: Alert sender (camera -> FloraScan rangers)
        run: python -I scripts/test_notifier.py

      - name: Pipeline rules (scripted scenes)
        run: python -I scripts/test_pipeline.py

  firmware:
    name: ESP32 firmware compiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32doit-devkit-v1
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - name: PubSubClient
              version: '2.8'
          sketch-paths: |
            - iot-kit/FloraScan_Node
          enable-warnings-report: true

  all-checks:
    name: All checks passed
    if: always()
    needs: [static, web, ai-vision, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.web.result }}" = success ] \
            && [ "${{ needs.ai-vision.result }}" = success ] && [ "${{ needs.firmware.result }}" = success ]
